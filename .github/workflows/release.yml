name: Release Desktop App

# Publishes installers as GitHub Release assets. Triggered by version tags, e.g.:
#   npm version 5.1.0 && git tag -a v5.1.0 -m "v5.1.0" && git push origin v5.1.0
#
# Each installer carries a standalone CPython with requirements.txt already installed
# (scripts/prepare_python_runtime.js), so the target machine needs no Python. Signing is
# driven by repository secrets/variables and degrades to an unsigned build that the
# release notes label as such.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v5.0.0). Leave empty to use the selected branch."
        required: false
        default: ""

permissions:
  contents: write

env:
  RUNTIME_PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows runners default run steps to PowerShell; these steps are POSIX shell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python (build tooling only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (fetches the bundled CPython)
        run: python -m pip install uv

      - name: Check version matches tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ steps.tag.outputs.name }}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version v${VERSION}"
            exit 1
          fi
          echo "Version consistent: ${VERSION}"

      - name: Audit Node dependencies
        run: npm ci && npm audit --audit-level=high

      - name: Report signing availability
        id: sign
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder reads certificates and notarization credentials straight from
          # its documented environment variables, so no config override is needed - and
          # `-c.win.sign=...` is rejected by the 26.x schema, which is how the first
          # packaging run failed. Without credentials the build is left unsigned and the
          # release notes say so.
          method="none"
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "$WIN_CSC_LINK" ]; then
            method="authenticode-certificate"
          elif [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$MAC_CSC_LINK" ] && [ -n "$APPLE_TEAM_ID" ]; then
            method="developer-id-plus-notarization"
          fi
          echo "method=$method" >> "$GITHUB_OUTPUT"
          if [ "$method" = "none" ]; then
            echo "::warning::No signing credentials for ${{ matrix.os }}; the artifact will be unsigned."
          fi

      - name: Install OpenMP runtime (needed by xgboost on macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libomp

      - name: Build the bundled Python runtime
        run: npm run runtime

      # The certificate variables are only set in the signed variants: mapping a missing
      # secret yields an empty string, and electron-builder then treats CSC_LINK as a
      # certificate path and dies with "<repo> not a file".
      - name: Build Windows installer (NSIS, unsigned)
        if: matrix.os == 'windows-latest' && steps.sign.outputs.method == 'none'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 -p never

      - name: Build Windows installer (NSIS, Authenticode)
        if: matrix.os == 'windows-latest' && steps.sign.outputs.method != 'none'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 -p never

      - name: Build macOS disk images (unsigned)
        if: matrix.os == 'macos-latest' && steps.sign.outputs.method == 'none'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --x64 --arm64 -p never

      - name: Build macOS disk images (Developer ID + notarization)
        if: matrix.os == 'macos-latest' && steps.sign.outputs.method != 'none'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 --arm64 -p never

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage -p never

      - name: Verify signatures
        if: success()
        env:
          METHOD: ${{ steps.sign.outputs.method }}
        run: |
          mkdir -p dist-signature
          case "${{ matrix.os }}" in
            windows-latest)
              for f in dist/*.exe; do
                [ -e "$f" ] || continue
                powershell -NoProfile -Command \
                  "\$s = Get-AuthenticodeSignature '$f'; \$s.Status; \$s.SignerCertificate.Subject" \
                  > "dist-signature/$(basename "$f").sig.txt" 2>&1 || true
                cat "dist-signature/$(basename "$f").sig.txt"
                if [ "$METHOD" != "none" ] && ! grep -qi "Valid" "dist-signature/$(basename "$f").sig.txt"; then
                  echo "::error::$f is not signed although credentials were provided"
                  exit 1
                fi
              done
              ;;
            macos-latest)
              APP="$(find dist -maxdepth 3 -name '*.app' -type d | head -1)"
              if [ -n "$APP" ]; then
                codesign --display --verbose=4 "$APP" > dist-signature/app.codesign.txt 2>&1 || true
                cat dist-signature/app.codesign.txt
                if [ "$METHOD" != "none" ] && ! grep -q "Authority=Developer ID" dist-signature/app.codesign.txt; then
                  echo "::error::$APP is not signed with a Developer ID certificate"
                  exit 1
                fi
              fi
              for d in dist/*.dmg; do
                [ -e "$d" ] || continue
                xcrun stapler validate "$d" > "dist-signature/$(basename "$d").staple.txt" 2>&1 || true
                cat "dist-signature/$(basename "$d").staple.txt"
              done
              ;;
            ubuntu-latest)
              sha256sum dist/*.AppImage > dist-signature/AppImage.sha256 || true
              cat dist-signature/AppImage.sha256
              ;;
          esac

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload signature report
        uses: actions/upload-artifact@v4
        with:
          name: signature-report-${{ matrix.os }}
          path: dist-signature
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"; else echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Download signature reports
        uses: actions/download-artifact@v4
        with:
          pattern: signature-report-*
          merge-multiple: true
          path: signature-report

      - name: List assets
        run: ls -lh dist

      - name: Collect changelog section
        id: notes
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## Multi-AutoML Interface ${VERSION}"
            echo
            awk -v head="## ${VERSION}" '
              $0 ~ "^"head { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### What is inside"
            echo
            echo "Each installer bundles a standalone CPython with everything in"
            echo "\`requirements.txt\` already installed, so **no Python setup is needed** on the"
            echo "target machine. Runs, models and the data lake are written to a per-user"
            echo "workspace (the app's Electron \`userData\` directory):"
            echo
            echo "| Operating system | Location |"
            echo "|---|---|"
            echo "| Windows | \`%APPDATA%\\multi-automl-desktop\\workspace\\` |"
            echo "| macOS | \`~/Library/Application Support/multi-automl-desktop/workspace/\\` |"
            echo "| Linux | \`~/.config/multi-automl-desktop/workspace/\\` |"
            echo
            echo "The heavy AutoML backends (AutoGluon, PyCaret, TPOT, Lale, H2O, AutoKeras,"
            echo "HuggingFace) stay optional and are lazy-imported; the app runs with whichever"
            echo "of them you install into the bundled runtime. H2O additionally needs Java 11+."
            echo
            if [ -s signature-report/app.codesign.txt ] || grep -lq "Valid" signature-report/* 2>/dev/null; then
              echo "### Signing"
              echo
              echo "Windows installers are Authenticode-signed and the macOS build is signed with a"
              echo "Developer ID certificate and notarized."
            else
              echo "### Signing"
              echo
              echo "These builds are **not code-signed or notarized**, so SmartScreen and Gatekeeper"
              echo "will warn on first launch."
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
          if ! grep -q "^## ${VERSION}" CHANGELOG.md; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Multi-AutoML Interface ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: ${{ steps.notes.outputs.missing == 'true' }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

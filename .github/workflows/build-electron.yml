name: Build Desktop App

# Packaging smoke test: builds the unpacked app for each OS and checks that the bundled
# Python runtime and the app sources landed where electron/main.js expects them.
# Real installers (signed, compressed) are produced by release.yml on version tags, so this
# workflow deliberately uploads nothing - a 1.2 GB payload per OS would only cost storage.

on:
  pull_request:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "scripts/prepare_python_runtime.js"
      - ".github/workflows/build-electron.yml"
  workflow_dispatch: # Allows running the workflow manually from the Actions tab

jobs:
  build:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Set up Python (build tooling for the bundled runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Install OpenMP runtime (needed by xgboost on macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libomp

      - name: Build the bundled Python runtime
        run: npm run runtime

      - name: Package unpacked app (no installer, no signing)
        env:
          # Smoke builds must not discover or generate a certificate: without this,
          # electron-builder self-signs every executable inside the bundled runtime.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          case "${{ matrix.os }}" in
            windows-latest) npx electron-builder --win --x64 --dir ;;
            macos-latest)   npx electron-builder --mac --x64 --arm64 --dir ;;
            ubuntu-latest)  npx electron-builder --linux --dir ;;
          esac

      - name: Check the packaged layout
        run: |
          # macOS packages into dist/mac-<arch>/<App>.app/Contents/Resources, Windows and
          # Linux into dist/<os>-unpacked/resources, so the runtime directory is located
          # by name and the interpreter path is read from its own manifest.
          found=0
          while IFS= read -r -d '' rt; do
            manifest="$rt/runtime-manifest.json"
            if [ ! -f "$manifest" ]; then echo "::error::no runtime-manifest.json in $rt"; exit 1; fi
            interp="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).interpreter)" "$manifest")"
            if [ ! -e "$rt/$interp" ]; then echo "::error::bundled interpreter $rt/$interp missing"; exit 1; fi
            res="$(dirname "$rt")"
            test -f "$res/app/app.py" || { echo "::error::app.py not packaged next to $res"; exit 1; }
            test -d "$res/app/src" || { echo "::error::src/ not packaged next to $res"; exit 1; }
            echo "OK: $rt ($interp)"
            found=1
          done < <(find dist -type d -name runtime -print0)
          if [ "$found" != "1" ]; then echo "::error::no bundled runtime found under dist/"; exit 1; fi


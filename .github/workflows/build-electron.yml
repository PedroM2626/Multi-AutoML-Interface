name: Build Desktop App

# Packaging smoke test: builds the unpacked app for each OS and checks that the bundled
# Python runtime and the app sources landed where electron/main.js expects them.
# Real installers (signed, compressed) are produced by release.yml on version tags, so this
# workflow deliberately uploads nothing - a 1.2 GB payload per OS would only cost storage.

on:
  pull_request:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "scripts/prepare_python_runtime.js"
      - ".github/workflows/build-electron.yml"
  workflow_dispatch: # Allows running the workflow manually from the Actions tab

jobs:
  build:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Set up Python (build tooling for the bundled runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Build the bundled Python runtime
        run: npm run runtime

      - name: Package unpacked app (no installer, no signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          case "${{ matrix.os }}" in
            windows-latest) npx electron-builder --win --x64 --dir -c.win.sign=false ;;
            macos-latest)   npx electron-builder --mac --x64 --arm64 --dir -c.mac.notarize=null ;;
            ubuntu-latest)  npx electron-builder --linux --dir ;;
          esac

      - name: Check the packaged layout
        run: |
          unpacked="$(find dist -maxdepth 1 -type d -name '*unpacked*' | head -1)"
          test -n "$unpacked" || { echo "::error::no unpacked directory produced"; exit 1; }
          echo "packaged into: $unpacked"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f "$unpacked/resources/runtime/python.exe"
          else
            test -x "$unpacked/resources/runtime/bin/python"
          fi
          test -f "$unpacked/resources/runtime/runtime-manifest.json"
          test -f "$unpacked/resources/app/app.py"
          test -d "$unpacked/resources/app/src"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            if (!m.interpreter || !m.requirementsHash) { console.error('manifest incomplete'); process.exit(1); }
            console.log('runtime manifest OK:', m.platform, m.arch, 'python', m.python);
          " "$unpacked/resources/runtime/runtime-manifest.json"

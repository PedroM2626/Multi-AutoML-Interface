name: Build Desktop App

on:
  # Smoke-test the desktop packaging only when its inputs change. Tag pushes are built
  # and published by release.yml, so a full 3-OS matrix on every push to main was waste.
  pull_request:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-electron.yml"
  workflow_dispatch: # Allows running the workflow manually from the Actions tab

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build-win

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build-mac

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build-linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-automl-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          retention-days: 7

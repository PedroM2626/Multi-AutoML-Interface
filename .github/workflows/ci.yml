name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  quick-pr:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt not found; installing minimal CI tooling"
            pip install ruff pytest
          fi
          # Minimal runtime deps for the gate tests. xgboost is not optional here:
          # flaml/automl imports it at module scope, and without it "from flaml import AutoML"
          # silently yields the namespace package, so the FLAML paths would only skip.
          pip install --force-reinstall numpy==2.5.0 pandas==2.3.3 scikit-learn==1.9.0 mlflow==3.16.1 flaml==2.6.0 lightgbm==4.7.0 xgboost==3.4.0 streamlit==1.58.0

      - name: Ruff critical lint
        run: ruff check .

      - name: Python syntax compile
        run: python -m compileall app.py run.py src tests

      - name: Regression flow tests
        run: |
          pytest -o addopts="" -q \
            tests/test_regression_flows.py tests/test_streamlit_gui.py \
            tests/test_task_dispatch.py tests/test_task_catalog.py \
            tests/test_engine_availability.py tests/test_doc_matrix_sync.py \
            tests/test_data_utils_guard.py tests/test_flaml_task_paths.py \
            tests/test_pycaret_task_paths.py tests/test_onnx_xai.py \
            tests/test_pillow_decode_surface.py tests/test_vuln_exceptions.py

  nightly-complete:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install baseline tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt not found; installing minimal CI tooling"
            pip install ruff pytest
          fi
          pip install --force-reinstall numpy==2.5.0 pandas==2.3.3 scikit-learn==1.9.0 mlflow==3.16.1 flaml==2.6.0 lightgbm==4.7.0 xgboost==3.4.0 streamlit==1.58.0

      - name: Quick validation gates
        run: |
          ruff check .
          python -m compileall app.py run.py src tests
          pytest -o addopts="" -q tests/test_regression_flows.py tests/test_streamlit_gui.py \
            tests/test_task_dispatch.py tests/test_task_catalog.py tests/test_engine_availability.py \
            tests/test_doc_matrix_sync.py tests/test_data_utils_guard.py tests/test_flaml_task_paths.py \
            tests/test_pycaret_task_paths.py tests/test_onnx_xai.py \
            tests/test_pillow_decode_surface.py tests/test_vuln_exceptions.py

      - name: Optional integration stack install
        id: stack
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Dependency vulnerability gate
        run: |
          python -m pip install pip-audit==2.10.1
          # Tolerated advisories are rows in .github/vuln-exceptions.json, each carrying the cap that
          # forces it. audit_exceptions.py refuses to emit flags for a row whose pin has moved, so an
          # exception cannot outlive the reason it was written for.
          #
          # Audited twice because pillow's row is defined by a condition, not by a list: whatever is
          # reported for 12.3.0 is excused only while each advisory is fixed by exactly 13.0.0,
          # the release Streamlit's `pillow<13` keeps out of reach. The first pass is the evidence
          # that condition is still true; anything fixed elsewhere stays red, because upgrading
          # would not have hidden it. It also means a batch of new advisories on the same blocked
          # version does not need a human to append ids at 03:00 - 16 ids landed in one batch the
          # night before this replaced a hand-listed set.
          pip-audit -r requirements.txt --strict -f json -o core-report.json || true
          test -s core-report.json || { echo "pip-audit produced no report"; exit 1; }
          core_flags="$(python scripts/audit_exceptions.py requirements.txt --report core-report.json)"
          pip-audit -r requirements.txt --strict $core_flags
          # pillow<13 is Streamlit's cap, not ours. The day it lifts this fails until the pin moves
          # and the pillow row is deleted.
          python scripts/pillow_cap_check.py requirements.txt

      - name: All-engine lock vulnerability gate
        run: |
          # requirements-all.txt is the lock the docs hand out for the full engine set, so the
          # environment users build by hand is audited too. Two adjustments, both because the runner
          # is not that lock's platform:
          # - pywin32 is pinned without a marker and publishes win32/win_amd64/win_arm64 wheels only,
          #   and pip-audit enumerates a lock by dry-run installing it, so that one line aborts the
          #   whole audit on Linux (it did, on the first run of this step). It is the only such pin -
          #   every release distribution of all 286 pins was checked - and it carries no advisory, so
          #   dropping it loses nothing auditable.
          # - --no-deps because resolving the file here would pick torch's CUDA build and audit a
          #   graph nobody installs. Every remaining pin is audited exactly as shipped.
          grep -v '^pywin32==' requirements-all.txt > requirements-all-audited.txt
          pip-audit -r requirements-all-audited.txt --strict --no-deps -f json -o all-report.json || true
          test -s all-report.json || { echo "pip-audit produced no report"; exit 1; }
          all_flags="$(python scripts/audit_exceptions.py requirements-all-audited.txt --as requirements-all.txt --report all-report.json)"
          pip-audit -r requirements-all-audited.txt --strict --no-deps $all_flags

      - name: Full suite (authoritative when the stack installed)
        if: steps.stack.outcome == 'success'
        run: pytest -o addopts="" -q tests

      - name: Report unusable integration stack
        if: steps.stack.outcome != 'success'
        run: echo "::warning::requirements.txt failed to install, so the full suite was not run. The nightly gate is limited to the quick gates above."

  # Every catalog row trained by the engine it claims, in one interpreter that has all seven
  # engines. This is the only gate that proves the catalog is a promise and not a list: the stack
  # requirements.txt installs (FLAML + AutoGluon tabular) covers its own rows in the full suite
  # above, but PyCaret, Lale, TPOT, H2O and AutoGluon multimodal only exist here.
  engine-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install every engine
        run: |
          python -m pip install --upgrade pip
          # From requirements-all.in rather than requirements-all.txt: that lock was compiled on
          # Windows, and this engine set does not have one portable lock - pywin32 is pinned with
          # no marker, and PyPI's Linux torch is the CUDA build (nvidia-*, triton), which does not
          # fit a runner. The CPU index offers 2.13.0+cpu, which pip prefers over 2.13.0.
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-all.in

      - name: Train every catalog row
        run: pytest -o addopts="" -q -m engine tests/test_engine_matrix.py
